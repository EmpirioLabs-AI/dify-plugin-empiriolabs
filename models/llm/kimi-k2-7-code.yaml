model: kimi-k2-7-code
label:
  en_US: Kimi K2.7 Code
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
  - multi-tool-call
model_properties:
  mode: chat
  context_size: 262144
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 32768
  - name: response_format
    use_template: response_format
pricing:
  input: "0.95"
  output: "4.00"
  unit: "0.000001"
  currency: USD
